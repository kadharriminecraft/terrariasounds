<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraria Sounds — Space Sound Board</title>
<style>
  :root {
    color-scheme: dark;
    --void:   #05060f;
    --ink:    #e8ecff;
    --dim:    #8b93c0;
    --cyan:   #5ee0ff;
    --violet: #a06bff;
    --magenta:#ff5fd0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 2.5rem 1.25rem 4rem;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: radial-gradient(1200px 700px at 78% -12%, #2a1a5e 0%, transparent 60%),
                radial-gradient(1000px 600px at 8% 4%, #123a63 0%, transparent 55%),
                linear-gradient(180deg, #070818 0%, var(--void) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  /* starfield */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute; top: 0; left: 0; border-radius: 50%;
    background: #fff; opacity: .9;
    animation: drift linear infinite, twinkle ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translate(0,0); } to { transform: translateY(115vh); } }
  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
  main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

  .eyebrow { margin: 0 0 .3rem; color: var(--cyan); font-size: .78rem; letter-spacing: .32em; text-transform: uppercase; }
  h1 {
    margin: 0 0 .35rem; font-size: 2.2rem; letter-spacing: -.02em; font-weight: 800;
    background: linear-gradient(90deg, #fff 10%, var(--cyan) 45%, var(--violet) 75%, var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px #7a5bff55);
  }
  p.sub { margin: 0 0 1.9rem; color: var(--dim); }
  p.sub a { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted #5ee0ff66; }
  p.sub a:hover { color: #fff; }

  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
  input[type=search] {
    flex: 1 1 220px; padding: .7rem 1rem; border-radius: 12px;
    border: 1px solid #ffffff1f; background: #ffffff08; color: var(--ink);
    font-size: 1rem; outline: none; transition: .2s;
  }
  input[type=search]::placeholder { color: #6b739c; }
  input[type=search]:focus { border-color: var(--cyan); background: #5ee0ff12; box-shadow: 0 0 0 3px #5ee0ff22; }

  button { font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); }
  .toolbar button, .card .play {
    border: 1px solid #ffffff26; background: linear-gradient(180deg, #ffffff14, #ffffff07);
    padding: .6rem 1.05rem; border-radius: 12px; transition: .18s;
    backdrop-filter: blur(6px);
  }
  .toolbar button:hover, .card .play:hover {
    border-color: var(--cyan); color: #fff; background: #5ee0ff1f;
    box-shadow: 0 0 18px #5ee0ff40;
  }
  .toolbar button:active, .card .play:active { transform: translateY(1px); }

  .grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); }
  .card {
    position: relative; overflow: hidden;
    background: linear-gradient(145deg, #141834 0%, #0a0c1e 100%);
    border: 1px solid #ffffff17; border-radius: 16px;
    padding: .9rem 1rem; display: flex; align-items: center; gap: .9rem;
    transition: .2s;
  }
  .card:hover { border-color: #ffffff33; transform: translateY(-2px); }
  .card.playing { border-color: var(--cyan); box-shadow: 0 0 0 1px #5ee0ff55, 0 0 30px #5ee0ff33; }
  /* animated sweep on the playing card */
  .card.playing::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, #5ee0ff22 50%, transparent 80%);
    background-size: 200% 100%;
    animation: sweep 1.6s linear infinite;
    pointer-events: none;
  }
  @keyframes sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  .card .play { flex: 0 0 auto; }
  .card.playing .play { border-color: var(--cyan); color: #fff; background: #5ee0ff2b; }
  .card .name { font-weight: 650; word-break: break-word; }
  .card .meta { color: var(--dim); font-size: .8rem; }
  .status { color: var(--dim); margin: 1.1rem 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: .45rem; vertical-align: middle; }
  .dot.on { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  a { color: var(--cyan); }
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>

<main>
  <p class="eyebrow">Signal · Deep Space Audio</p>
  <h1>Terraria Sounds</h1>
  <p class="sub">Every audio file in <a href="https://github.com/kadharriminecraft/terrariasounds" target="_blank" rel="noopener">kadharriminecraft/terrariasounds</a>, playable in the browser.</p>

  <div class="toolbar">
    <input type="search" id="filter" placeholder="Filter sounds…" aria-label="Filter sounds">
    <button id="stopAll" type="button">■ Stop all</button>
    <button id="reload" type="button">↻ Rescan</button>
  </div>

  <p class="status" id="status"><span class="dot" id="dot"></span>Loading…</p>
  <div class="grid" id="grid"></div>
</main>

<script>
// --- starfield ---------------------------------------------------------
const starsEl = document.getElementById("stars");
for (let i = 0; i < 140; i++) {
  const s = document.createElement("div");
  const size = Math.random() * 2 + 1;
  const dur = 20 + Math.random() * 60;
  s.className = "star";
  s.style.width = s.style.height = size + "px";
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = (-Math.random() * 100) + "vh";
  s.style.setProperty("animation-duration", dur + "s, " + (2 + Math.random() * 4) + "s");
  s.style.animationDelay = -Math.random() * 60 + "s, 0s";
  starsEl.appendChild(s);
}

// --- board -------------------------------------------------------------
const OWNER = "kadharriminecraft", REPO = "terrariasounds", BRANCH = "main";
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const AUDIO = /\.(mp3|wav|ogg|m4a|flac|aac|opus|weba)$/i;

// Fallback list, used if the GitHub API is unreachable (offline / rate-limited).
const FALLBACK = ["Music_forrest-day.mp3", "sfx_hurt.mp3"];

let items = [];
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const dotEl = document.getElementById("dot");
const filterEl = document.getElementById("filter");
let current = null;

function human(bytes) {
  if (!bytes) return "";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (bytes >= 1024 && i < u.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(bytes < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
}

function setStatus(text, playing) {
  statusEl.textContent = text;
  const d = document.createElement("span");
  d.className = "dot" + (playing ? " on" : "");
  statusEl.prepend(d);
}

function render() {
  const q = filterEl.value.trim().toLowerCase();
  const shown = items.filter(f => f.name.toLowerCase().includes(q));
  grid.textContent = "";
  for (const f of shown) grid.appendChild(card(f));
  setStatus(shown.length
    ? `${shown.length} sound${shown.length === 1 ? "" : "s"} in orbit`
    : "No signals found.", !!current);
}

function card(file) {
  const el = document.createElement("div");
  el.className = "card";

  const btn = document.createElement("button");
  btn.className = "play";
  btn.type = "button";
  btn.textContent = "▶";
  btn.setAttribute("aria-label", "Play " + file.name);

  const info = document.createElement("div");
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = file.name;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [file.dir, human(file.size)].filter(Boolean).join(" · ");
  info.append(name, meta);

  btn.addEventListener("click", () => play(el, file, btn));
  el.append(btn, info);
  return el;
}

function stop() {
  if (current) { current.audio.pause(); current.btn.textContent = "▶"; current.card.classList.remove("playing"); current = null; }
  setStatus(`${items.length} sound${items.length === 1 ? "" : "s"} in orbit`, false);
}

function play(el, file, btn) {
  if (current) { current.audio.pause(); current.btn.textContent = "▶"; current.card.classList.remove("playing"); }
  const audio = new Audio(file.url);
  audio.preload = "none";
  btn.textContent = "❚❚";
  el.classList.add("playing");
  current = { audio, card: el, btn };
  setStatus("Now playing: " + file.name, true);
  audio.addEventListener("ended", stop);
  audio.addEventListener("error", () => {
    stop();
    setStatus(`Couldn't play ${file.name} — file may be empty or missing.`, false);
  });
  audio.play().catch(err => {
    stop();
    setStatus(`Couldn't play ${file.name}: ${err.message}`, false);
  });
}

async function scan() {
  stop();
  setStatus("Scanning the repo…", false);
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const data = await res.json();
    const found = (data.tree || [])
      .filter(n => n.type === "blob" && AUDIO.test(n.path))
      .map(n => ({ name: n.path.split("/").pop(), dir: n.path.includes("/") ? n.path.split("/").slice(0, -1).join("/") : "", size: n.size, url: RAW + n.path.split("/").map(encodeURIComponent).join("/") }));
    items = found.length ? found : FALLBACK.map(n => ({ name: n, dir: "", size: 0, url: RAW + n }));
  } catch {
    items = FALLBACK.map(n => ({ name: n, dir: "", size: 0, url: RAW + n }));
  }
  render();
}

filterEl.addEventListener("input", render);
document.getElementById("reload").addEventListener("click", scan);
document.getElementById("stopAll").addEventListener("click", stop);

scan();
</script>
</body>
</html>
