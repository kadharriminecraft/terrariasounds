<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraria Sounds — Sound Board</title>
<meta name="description" content="A space-themed sound board for every audio file in kadharriminecraft/terrariasounds.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="hero">
    <h1>🎀 Terraria Sounds</h1>
    <p class="sub">Every audio file in <a href="https://github.com/kadharriminecraft/terrariasounds" target="_blank" rel="noopener">kadharriminecraft/terrariasounds</a>, playable in the browser.</p>
    <span class="tagline">Deep space audio library</span>
  </header>

  <div class="toolbar">
    <input type="search" id="filter" placeholder="Filter sounds…" aria-label="Filter sounds">
    <button id="stopAll" type="button">⏹ Stop all</button>
    <button id="reload" type="button">↻ Rescan</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">Loading…</p>
  <div class="grid" id="grid"></div>
</main>

<script src="app.js"></script>
</body>
</html>
