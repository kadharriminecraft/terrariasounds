<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lakewood Sounds — a cozy sound board</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f4fbff;
    --mist: #cfe9f2;
    --glass: rgba(255,255,255,0.14);
    --glass-2: rgba(255,255,255,0.22);
    --edge: rgba(255,255,255,0.28);
    --pine-1: #1d5a4a;
    --pine-2: #2f7a5f;
    --glow: #ffe6a7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 16px/1.55 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #7ec8e3 0%, #bfe6f2 38%, #e9f7fb 60%, #9fd3c6 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* ---------- scene ---------- */
  .scene { position: fixed; inset: 0; z-index: -2; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .haze { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 0%, #ffe6a733, transparent 55%),
                radial-gradient(90% 60% at 50% 100%, #0b3a4a55, transparent 60%);
  }

  /* sun glow pulse */
  .sun { animation: breathe 6s ease-in-out infinite; transform-origin: 78% 16%; }
  @keyframes breathe { 0%,100% { opacity:.85; } 50% { opacity:1; } }
  .drift { animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  .firefly { animation: flicker 4s ease-in-out infinite; }
  .firefly:nth-child(2n) { animation-duration: 5.4s; animation-delay: -1.2s; }
  .firefly:nth-child(3n) { animation-duration: 3.4s; animation-delay: -2.4s; }
  @keyframes flicker { 0%,100% { opacity:.15; r:1.6; } 50% { opacity:.9; r:2.6; } }
  .ripple { animation: ripple 5s linear infinite; }
  .ripple.r2 { animation-duration: 7s; animation-delay: -2s; }
  .ripple.r3 { animation-duration: 9s; animation-delay: -4s; }
  @keyframes ripple { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
  .sway { transform-origin: bottom center; animation: sway 6s ease-in-out infinite alternate; }
  .sway.s2 { animation-duration: 7.5s; animation-delay: -1.5s; }
  .sway.s3 { animation-duration: 5.4s; animation-delay: -3s; }
  @keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
  .cabin-glow { animation: lamp 3.5s ease-in-out infinite alternate; }
  @keyframes lamp { from { opacity:.75; } to { opacity:1; } }
  .cloud { animation: cloud 60s linear infinite; }
  .cloud.c2 { animation-duration: 95s; animation-delay: -30s; }
  @keyframes cloud { from { transform: translateX(-30%); } to { transform: translateX(130%); } }

  /* ---------- content ---------- */
  main { max-width: 940px; margin: 0 auto; padding: 3.5rem 1.25rem 5rem; }
  .badge {
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .3rem .8rem; border-radius: 999px; font-size: .78rem; letter-spacing: .12em;
    text-transform: uppercase; background: var(--glass); border: 1px solid var(--edge);
    backdrop-filter: blur(10px); color: var(--mist); margin-bottom: 1rem;
  }
  h1 {
    margin: 0 0 .4rem; font-size: clamp(2.3rem, 6vw, 3.6rem); line-height: 1.05;
    letter-spacing: -.03em;
    text-shadow: 0 3px 0 #0b3a4a33, 0 10px 26px #0b3a4a44;
  }
  h1 span { color: var(--glow); }
  p.sub { margin: 0 0 2rem; max-width: 46ch; color: #eaf7fb; text-shadow: 0 2px 8px #0b3a4a55; }
  p.sub a { color: var(--glow); }

  .panel {
    background: linear-gradient(180deg, #ffffff26, #ffffff12);
    border: 1px solid var(--edge);
    border-radius: 26px;
    padding: 1.1rem 1.1rem 1.4rem;
    box-shadow: 0 20px 50px #0b3a4a3d, inset 0 1px 0 #ffffff4d;
    backdrop-filter: blur(14px) saturate(1.2);
  }

  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  input[type=search] {
    flex: 1 1 220px; padding: .7rem 1.1rem; border-radius: 999px;
    border: 1px solid var(--edge); background: #ffffff2e; color: #fff;
    font: inherit; font-size: 1rem; outline: none; backdrop-filter: blur(8px);
    box-shadow: inset 0 2px 6px #0b3a4a26;
  }
  input[type=search]::placeholder { color: #eaf7fbc9; }
  input[type=search]:focus { background: #ffffff3d; border-color: #ffffff8c; }

  button { font: inherit; font-weight: 700; cursor: pointer; color: #0b3a4a; }
  .toolbar button {
    border: 1px solid #ffffff8c; border-radius: 999px; padding: .65rem 1.2rem;
    background: linear-gradient(180deg, #ffffff, #dff2f7);
    box-shadow: 0 6px 16px #0b3a4a40, inset 0 -2px 0 #b9d9e4;
    transition: transform .12s, box-shadow .12s, filter .15s;
  }
  .toolbar button:hover { filter: brightness(1.04); transform: translateY(-2px); }
  .toolbar button:active { transform: translateY(1px); }

  .status { margin: .2rem 0 1rem; font-weight: 700; color: #eaf7fb; text-shadow: 0 2px 6px #0b3a4a66; }

  .grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card {
    display: flex; align-items: center; gap: .9rem;
    padding: .8rem 1rem; border-radius: 20px;
    background: linear-gradient(180deg, #ffffff2b, #ffffff12);
    border: 1px solid var(--edge);
    box-shadow: 0 8px 20px #0b3a4a33, inset 0 1px 0 #ffffff40;
    backdrop-filter: blur(12px);
    transition: transform .18s, box-shadow .18s, background .2s;
  }
  .card:hover { transform: translateY(-3px); background: linear-gradient(180deg, #ffffff3d, #ffffff1c); }
  .card.playing {
    background: linear-gradient(180deg, #ffe6a755, #ffd98a2b);
    border-color: #ffe6a7cc;
    animation: ripple 2.2s ease-out infinite;
  }
  @keyframes ripple {
    0% { box-shadow: 0 0 0 0 #ffe6a766, 0 8px 20px #0b3a4a33; }
    70% { box-shadow: 0 0 0 16px #ffe6a700, 0 8px 20px #0b3a4a33; }
    100% { box-shadow: 0 0 0 0 #ffe6a700, 0 8px 20px #0b3a4a33; }
  }
  .card .play {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid #ffffffb3; font-size: 1.05rem; color: #0b3a4a;
    background: radial-gradient(circle at 32% 28%, #ffffff, #bfe4ef);
    box-shadow: 0 5px 12px #0b3a4a47, inset 0 -3px 0 #a9d0de;
    display: grid; place-items: center;
    transition: transform .12s, filter .15s;
  }
  .card .play:hover { filter: brightness(1.06); transform: scale(1.07); }
  .card .play:active { transform: scale(.95); }
  .card .name { font-weight: 800; word-break: break-word; text-shadow: 0 2px 6px #0b3a4a55; }
  .card .meta { font-size: .8rem; color: #dff2f8; }

  footer { margin-top: 2rem; text-align: center; font-size: .85rem; color: #eaf7fbc9; text-shadow: 0 2px 6px #0b3a4a55; }
  footer a { color: var(--glow); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
<svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fb6dd"/><stop offset="55%" stop-color="#bfe6f2"/><stop offset="100%" stop-color="#f6f0d8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc9c2"/><stop offset="45%" stop-color="#3f9aa6"/><stop offset="100%" stop-color="#12556a"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8fc0d4"/><stop offset="100%" stop-color="#6ea6bf"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6f9fbb"/><stop offset="100%" stop-color="#4f7f9e"/></linearGradient>
    <radialGradient id="sunG"><stop offset="0%" stop-color="#fff8dc"/><stop offset="55%" stop-color="#ffe6a7" stop-opacity=".85"/><stop offset="100%" stop-color="#ffe6a7" stop-opacity="0"/></radialGradient>
    <linearGradient id="cbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a8673c"/><stop offset="100%" stop-color="#7d4526"/></linearGradient>
    <g id="pine">
      <rect x="-4" y="0" width="8" height="18" fill="#5b3a22"/>
      <path d="M0 -78 L26 -22 H-26Z" fill="#1d5a4a"/>
      <path d="M0 -56 L30 -2 H-30Z" fill="#256a55"/>
      <path d="M0 -34 L32 18 H-32Z" fill="#2f7a5f"/>
    </g>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <g class="sun">
    <circle cx="1120" cy="150" r="190" fill="url(#sunG)"/>
    <circle cx="1120" cy="150" r="54" fill="#fff3cf"/>
  </g>

  <!-- clouds -->
  <g class="cloud" fill="#ffffff" opacity=".65">
    <ellipse cx="200" cy="140" rx="90" ry="34"/><ellipse cx="270" cy="128" rx="66" ry="30"/><ellipse cx="130" cy="150" rx="56" ry="24"/>
  </g>
  <g class="cloud c2" fill="#ffffff" opacity=".5">
    <ellipse cx="700" cy="90" rx="110" ry="30"/><ellipse cx="790" cy="80" rx="70" ry="26"/>
  </g>

  <!-- far mountains -->
  <path class="drift" d="M0 470 L180 300 L330 430 L470 330 L640 470 L820 350 L1000 470 L1220 320 L1440 470 V520 H0Z" fill="url(#m1)" opacity=".75"/>
  <path class="drift" d="M0 500 L200 380 L360 500 L520 400 L700 500 L900 390 L1100 500 L1300 400 L1440 500 V540 H0Z" fill="url(#m2)" opacity=".85"/>

  <!-- far treeline -->
  <g class="drift" opacity=".7">
    <use href="#pine" x="60" y="520" transform="scale(0.8) translate(15 130)"/>
    <use href="#pine" x="150" y="520" transform="scale(0.9) translate(17 116)"/>
    <use href="#pine" x="1320" y="520" transform="scale(0.85) translate(235 122)"/>
    <use href="#pine" x="1390" y="520" transform="scale(0.7) translate(397 186)"/>
  </g>

  <!-- water -->
  <rect y="520" width="1440" height="380" fill="url(#water)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <g class="ripple" opacity=".35">
      <path d="M40 600 q30 -10 60 0 t60 0" stroke-width="4"/><path d="M300 660 q30 -10 60 0 t60 0" stroke-width="3"/>
      <path d="M820 620 q30 -10 60 0 t60 0" stroke-width="3"/><path d="M1150 700 q30 -10 60 0 t60 0" stroke-width="4"/>
      <path d="M520 760 q30 -10 60 0 t60 0" stroke-width="3"/>
    </g>
    <g class="ripple r2" opacity=".28">
      <path d="M150 700 q30 -10 60 0 t60 0" stroke-width="3"/><path d="M700 820 q30 -10 60 0 t60 0" stroke-width="4"/>
      <path d="M1000 560 q30 -10 60 0 t60 0" stroke-width="3"/>
    </g>
    <g class="ripple r3" opacity=".22">
      <path d="M420 580 q30 -10 60 0 t60 0" stroke-width="3"/><path d="M900 740 q30 -10 60 0 t60 0" stroke-width="3"/>
      <path d="M1250 600 q30 -10 60 0 t60 0" stroke-width="4"/>
    </g>
  </g>
  <!-- sun reflection -->
  <g opacity=".35" fill="#ffe6a7">
    <ellipse class="ripple" cx="1120" cy="580" rx="60" ry="7"/>
    <ellipse class="ripple r2" cx="1120" cy="620" rx="42" ry="6"/>
    <ellipse class="ripple r3" cx="1120" cy="665" rx="26" ry="5"/>
  </g>

  <!-- left shore -->
  <g class="drift">
    <path d="M0 520 q160 -40 300 -10 q120 26 200 10 V900 H0Z" fill="#2b6a52"/>
    <path d="M0 560 q180 40 330 6 q110 -26 170 -8 V900 H0Z" fill="#3c7a56" opacity=".7"/>
  </g>
  <!-- right shore -->
  <g class="drift">
    <path d="M1440 520 q-180 -46 -330 -8 q-110 28 -190 8 V900 H1440Z" fill="#2b6a52"/>
  </g>

  <!-- trees on left -->
  <g class="sway">
    <use href="#pine" x="60" y="600"/>
  </g>
  <g class="sway s2">
    <use href="#pine" x="150" y="640" transform="scale(1.2) translate(-25 -160)"/>
  </g>
  <g class="sway s3">
    <use href="#pine" x="255" y="610" transform="scale(0.9) translate(28 120)"/>
  </g>
  <!-- trees on right -->
  <g class="sway s2">
    <use href="#pine" x="1390" y="600"/>
  </g>
  <g class="sway">
    <use href="#pine" x="1300" y="640" transform="scale(1.2) translate(-87 -160)"/>
  </g>
  <g class="sway s3">
    <use href="#pine" x="1205" y="610" transform="scale(0.85) translate(212 140)"/>
  </g>

  <!-- cabin on left shore -->
  <g class="sway s2">
    <ellipse cx="150" cy="700" rx="130" ry="16" fill="#0b3a4a33"/>
    <rect x="60" y="590" width="180" height="110" rx="6" fill="url(#cbody)"/>
    <g stroke="#5f3320" stroke-width="3" opacity=".6">
      <path d="M60 622 H240"/><path d="M60 654 H240"/><path d="M60 686 H240"/>
    </g>
    <path d="M40 592 L150 500 L260 592 Z" fill="#7c4a2c"/>
    <path d="M40 592 L150 500 L260 592 Z" fill="none" stroke="#5f3320" stroke-width="5" stroke-linejoin="round"/>
    <rect x="196" y="452" width="20" height="60" rx="4" fill="#6d3f28"/>
    <rect x="128" y="620" width="42" height="80" rx="4" fill="#5f3320"/>
    <rect x="82" y="612" width="34" height="34" rx="4" class="cabin-glow" fill="#ffdf8f" stroke="#5f3320" stroke-width="4"/>
    <path d="M82 629 H116 M99 612 V646" stroke="#5f3320" stroke-width="3"/>
  </g>

  <!-- dock -->
  <g>
    <rect x="960" y="640" width="190" height="10" rx="3" fill="#8a5a34"/>
    <g fill="#6d4526">
      <rect x="980" y="648" width="9" height="60" rx="3"/>
      <rect x="1105" y="648" width="9" height="60" rx="3"/>
    </g>
    <g stroke="#a9713f" stroke-width="2" opacity=".5">
      <path d="M960 645 H1150"/>
    </g>
  </g>

  <!-- fireflies -->
  <g fill="#fff2b8">
    <circle class="firefly" cx="420" cy="470" r="2"/>
    <circle class="firefly" cx="640" cy="520" r="2"/>
    <circle class="firefly" cx="880" cy="440" r="2"/>
    <circle class="firefly" cx="1050" cy="520" r="2"/>
    <circle class="firefly" cx="1250" cy="460" r="2"/>
  </g>
</svg>
</div>
<div class="haze"></div>

<main>
  <span class="badge">🎣 cozy lake sound board</span>
  <h1>🏕️ <span>Lakewood</span> Sounds</h1>
  <p class="sub">Sit by the water, kick your feet in. A little collection of sounds from
    <a href="https://github.com/kadharriminecraft/terrariasounds" target="_blank" rel="noopener">kadharriminecraft/terrariasounds</a>.</p>

  <div class="panel">
    <div class="toolbar">
      <input type="search" id="filter" placeholder="Search the shallows..." aria-label="Filter sounds">
      <button id="stopAll" type="button">⏹ Stop all</button>
      <button id="reload" type="button">↻ Rescan</button>
    </div>

    <p class="status" id="status">Warming up the campfire…</p>
    <div class="grid" id="grid"></div>
  </div>

  <footer>Made with 🪵, 🌲 and a lot of 🌊</footer>
</main>

<script>
const OWNER = "kadharriminecraft", REPO = "terrariasounds", BRANCH = "main";
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const AUDIO = /\.(mp3|wav|ogg|m4a|flac|aac|opus|weba)$/i;
const FALLBACK = ["Music_forrest-day.mp3", "sfx_hurt.mp3"];

let items = [];
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const filterEl = document.getElementById("filter");
let current = null;

function human(bytes) {
  if (!bytes) return "";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (bytes >= 1024 && i < u.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(bytes < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
}

function render() {
  const q = filterEl.value.trim().toLowerCase();
  const shown = items.filter(f => f.name.toLowerCase().includes(q));
  grid.textContent = "";
  for (const f of shown) grid.appendChild(card(f));
  statusEl.textContent = shown.length
    ? `🎶 ${shown.length} sound${shown.length === 1 ? "" : "s"} rippling by`
    : "Nothing floating here — try another search.";
}

function card(file) {
  const el = document.createElement("div");
  el.className = "card";

  const btn = document.createElement("button");
  btn.className = "play";
  btn.type = "button";
  btn.textContent = "▶";
  btn.setAttribute("aria-label", "Play " + file.name);

  const info = document.createElement("div");
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = file.name;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [file.dir, human(file.size)].filter(Boolean).join(" · ");
  info.append(name, meta);

  btn.addEventListener("click", () => play(el, file, btn));
  el.append(btn, info);
  return el;
}

function play(el, file, btn) {
  if (current) { current.audio.pause(); current.card.classList.remove("playing"); current.btn.textContent = "▶"; }
  const audio = new Audio(file.url);
  audio.preload = "none";
  btn.textContent = "⏸";
  el.classList.add("playing");
  current = { audio, card: el, btn };
  audio.addEventListener("ended", () => { btn.textContent = "▶"; el.classList.remove("playing"); });
  audio.play().catch(err => {
    statusEl.textContent = `Couldn't play ${file.name}: ${err.message}`;
    btn.textContent = "▶"; el.classList.remove("playing");
  });
}

async function scan() {
  statusEl.textContent = "Casting a line…";
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const data = await res.json();
    const found = (data.tree || [])
      .filter(n => n.type === "blob" && AUDIO.test(n.path))
      .map(n => ({ name: n.path.split("/").pop(), dir: n.path.includes("/") ? n.path.split("/").slice(0, -1).join("/") : "", size: n.size, url: RAW + n.path.split("/").map(encodeURIComponent).join("/") }));
    items = found.length ? found : FALLBACK.map(n => ({ name: n, dir: "", size: 0, url: RAW + n }));
  } catch {
    items = FALLBACK.map(n => ({ name: n, dir: "", size: 0, url: RAW + n }));
  }
  render();
}

filterEl.addEventListener("input", render);
document.getElementById("reload").addEventListener("click", scan);
document.getElementById("stopAll").addEventListener("click", () => {
  if (current) { current.audio.pause(); current.btn.textContent = "▶"; current.card.classList.remove("playing"); current = null; }
});

scan();
</script>
</body>
</html>
