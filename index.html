<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraria Sounds — Sound Board</title>
<style>
  :root {
    color-scheme: dark;
    --pink-50:  #fff0f7;
    --pink-200: #ffc0e0;
    --pink-300: #ff9bcb;
    --pink-400: #ff5fae;
    --pink-500: #ff2e93;
    --pink-600: #e6006f;
    --pink-700: #b30057;
    --ink:      #2a0a1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--pink-50);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 12% -10%, #ff2e9366, transparent 60%),
      radial-gradient(900px 600px at 90% 0%, #ff8ac866, transparent 60%),
      linear-gradient(160deg, #ff5fae 0%, #ff2e93 35%, #b30057 75%, #6b0039 100%);
    background-attachment: fixed;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 {
    margin: 0 0 .25rem; font-size: 2.1rem; letter-spacing: -.02em;
    color: #fff; text-shadow: 0 3px 0 #b30057, 0 8px 24px #4d002670;
  }
  p.sub { margin: 0 0 1.75rem; color: var(--pink-200); }
  p.sub a { color: #fff; font-weight: 600; }

  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  input[type=search] {
    flex: 1 1 220px; padding: .65rem .9rem; border-radius: 999px;
    border: 2px solid #fff6; background: #ffffff2e; color: #fff;
    font-size: 1rem; outline: none; backdrop-filter: blur(4px);
  }
  input[type=search]::placeholder { color: #ffd7ea; }
  input[type=search]:focus { border-color: #fff; background: #ffffff44; }

  button { font: inherit; cursor: pointer; font-weight: 600; }
  .toolbar button, .card .play {
    border: 2px solid #fff6; color: #fff;
    background: linear-gradient(180deg, #ff7fbd, #e6006f);
    padding: .6rem 1.1rem; border-radius: 999px;
    box-shadow: 0 4px 0 #8c0047cc, 0 10px 20px #4d002655;
    transition: transform .12s, box-shadow .12s, background .15s, filter .15s;
  }
  .toolbar button:hover, .card .play:hover { background: linear-gradient(180deg, #ffa0d1, #ff2e93); filter: brightness(1.05); }
  .toolbar button:active, .card .play:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c0047cc; }

  .grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); }
  .card {
    background: #fff2; border: 2px solid #fff5; border-radius: 18px;
    padding: .85rem 1rem; display: flex; align-items: center; gap: .9rem;
    backdrop-filter: blur(6px); transition: .15s;
  }
  .card.playing {
    border-color: #fff; background: #ffffff44;
    box-shadow: 0 0 0 4px #ffffff33, 0 10px 26px #4d002666;
    animation: glow 1.2s ease-in-out infinite alternate;
  }
  @keyframes glow { to { box-shadow: 0 0 0 8px #ffffff22, 0 12px 34px #ff2e9399; } }
  .card .name { font-weight: 700; color: #fff; word-break: break-word; text-shadow: 0 1px 2px #8c004766; }
  .card .meta { color: var(--pink-200); font-size: .8rem; }
  .card .play { flex: 0 0 auto; }
  .status { color: var(--pink-200); margin: 1rem 0; font-weight: 600; }
  a { color: #fff; }
</style>
</head>
<body>
<main>
  <h1>🎀 Terraria Sounds</h1>
  <p class="sub">Every audio file in <a href="https://github.com/kadharriminecraft/terrariasounds" target="_blank" rel="noopener">kadharriminecraft/terrariasounds</a>, playable in the browser.</p>

  <div class="toolbar">
    <input type="search" id="filter" placeholder="Filter sounds…" aria-label="Filter sounds">
    <button id="stopAll" type="button">⏹ Stop all</button>
    <button id="reload" type="button">↻ Rescan</button>
  </div>

  <p class="status" id="status">Loading…</p>
  <div class="grid" id="grid"></div>
</main>

<script>
const OWNER = "kadharriminecraft", REPO = "terrariasounds", BRANCH = "main";
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const AUDIO = /\.(mp3|wav|ogg|m4a|flac|aac|opus|weba)$/i;

// Fallback list, used if the GitHub API is unreachable (offline / rate-limited).
const FALLBACK = ["Music_forrest-day.mp3", "sfx_hurt.mp3"];

let items = [];
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const filterEl = document.getElementById("filter");
let current = null;

function human(bytes) {
  if (!bytes) return "";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (bytes >= 1024 && i < u.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(bytes < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
}

function render() {
  const q = filterEl.value.trim().toLowerCase();
  const shown = items.filter(f => f.name.toLowerCase().includes(q));
  grid.textContent = "";
  for (const f of shown) grid.appendChild(card(f));
  statusEl.textContent = shown.length
    ? `${shown.length} sound${shown.length === 1 ? "" : "s"}`
    : "No sounds found.";
}

function card(file) {
  const el = document.createElement("div");
  el.className = "card";

  const btn = document.createElement("button");
  btn.className = "play";
  btn.type = "button";
  btn.textContent = "▶";

  const info = document.createElement("div");
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = file.name;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [file.dir, human(file.size)].filter(Boolean).join(" · ");
  info.append(name, meta);

  btn.addEventListener("click", () => play(el, file, btn));
  el.append(btn, info);
  return el;
}

function play(el, file, btn) {
  if (current) { current.audio.pause(); current.card.classList.remove("playing"); }
  const audio = new Audio(file.url);
  audio.preload = "none";
  btn.textContent = "⏸";
  el.classList.add("playing");
  current = { audio, card: el, btn };
  audio.addEventListener("ended", () => { btn.textContent = "▶"; el.classList.remove("playing"); });
  audio.play().catch(err => {
    statusEl.textContent = `Couldn't play ${file.name}: ${err.message}`;
    btn.textContent = "▶"; el.classList.remove("playing");
  });
}

async function scan() {
  statusEl.textContent = "Loading…";
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const data = await res.json();
    const found = (data.tree || [])
      .filter(n => n.type === "blob" && AUDIO.test(n.path))
      .map(n => ({ name: n.path.split("/").pop(), dir: n.path.includes("/") ? n.path.split("/").slice(0, -1).join("/") : "", size: n.size, url: RAW + n.path.split("/").map(encodeURIComponent).join("/") }));
    items = found.length ? found : FALLBACK.map(n => ({ name: n, dir: "", size: 0, url: RAW + n }));
  } catch {
    items = FALLBACK.map(n => ({ name: n, dir: "", size: 0, url: RAW + n }));
  }
  render();
}

filterEl.addEventListener("input", render);
document.getElementById("reload").addEventListener("click", scan);
document.getElementById("stopAll").addEventListener("click", () => {
  if (current) { current.audio.pause(); current.btn.textContent = "▶"; current.card.classList.remove("playing"); current = null; }
});

scan();
</script>
</body>
</html>
